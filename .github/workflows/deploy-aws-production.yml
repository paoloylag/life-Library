name: Deploy AWS production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: life-library-backend
  ECS_CLUSTER: life-library-production
  ECS_SERVICE: life-library-production-api
  ECS_CONTAINER: api
  STACK_NAME: life-library-production
  PUBLIC_URL: https://library.life.edu.ph

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Build and deploy production
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: aws-production
      url: https://library.life.edu.ph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --file backend/Dockerfile --tag "$IMAGE_URI" backend
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Register release task definition
        id: task
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json
          jq --arg image "$IMAGE_URI" --arg container "$ECS_CONTAINER" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions |= map(
                if .name == $container then .image = $image else . end
              )
          ' task-definition.json > release-task-definition.json
          RELEASE_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://release-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$RELEASE_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Read ECS network configuration
        id: network
        run: |
          NETWORK_CONFIGURATION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json)
          echo "json=$(echo "$NETWORK_CONFIGURATION" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          TASK_DEFINITION: ${{ steps.task.outputs.arn }}
          NETWORK_CONFIGURATION: ${{ steps.network.outputs.json }}
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION" \
            --network-configuration "$NETWORK_CONFIGURATION" \
            --overrides '{"containerOverrides":[{"name":"api","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ECS did not start the migration task."
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='$ECS_CONTAINER'].exitCode | [0]" \
            --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
            exit 1
          fi

      - name: Deploy backend service
        env:
          TASK_DEFINITION: ${{ steps.task.outputs.arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ''
          VITE_BASE_PATH: /
          VITE_PUBLIC_APP_URL: ${{ env.PUBLIC_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish frontend
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue | [0]" \
            --output text)
          DISTRIBUTION=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue | [0]" \
            --output text)
          aws s3 sync frontend/dist "s3://$BUCKET" \
            --delete --exclude index.html \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type text/html
          INVALIDATION=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION" \
            --id "$INVALIDATION"

      - name: Smoke test production
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 10 "$PUBLIC_URL/" > /dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 10 "$PUBLIC_URL/attendance" > /dev/null
          HEALTH=$(curl --fail --silent --show-error --retry 8 --retry-delay 10 "$PUBLIC_URL/api/health")
          echo "$HEALTH" | jq -e '.status == "ok"' > /dev/null
