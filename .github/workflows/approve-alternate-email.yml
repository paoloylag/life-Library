name: Approve alternate Google email
on:
  workflow_dispatch:
    inputs:
      number:
        description: Existing library user number
        required: true
      expected_name:
        description: Exact existing profile name
        required: true
      email:
        description: Approved alternate Google email
        required: true
      actor_email:
        description: Requesting administrator email for audit history
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-production
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    environment: aws-production
    env:
      AWS_REGION: ap-southeast-1
      ECS_CLUSTER: life-library-production
      ECS_SERVICE: life-library-production-api
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Prepare audited approval task
        env:
          NUMBER: ${{ inputs.number }}
          EXPECTED_NAME: ${{ inputs.expected_name }}
          APPROVED_EMAIL: ${{ inputs.email }}
          ACTOR_EMAIL: ${{ inputs.actor_email }}
          OPERATOR: ${{ github.actor }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = dict(number=os.environ['NUMBER'], expected_name=os.environ['EXPECTED_NAME'], email=os.environ['APPROVED_EMAIL'], actor_email=os.environ['ACTOR_EMAIL'], operator=os.environ['OPERATOR'])
          code = Path('infra/aws/approve_alternate_email.py').read_text()
          override = dict(containerOverrides=[dict(name='api',command=['python','-c',code],environment=[dict(name='RUN_MIGRATIONS',value='false'),dict(name='APPROVAL_REQUEST',value=json.dumps(payload))])])
          Path('approval-overrides.json').write_text(json.dumps(override))
          PY
      - name: Approve and verify existing profile
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" > service.json
          TASK_DEFINITION=$(jq -r '.services[0].taskDefinition' service.json)
          NETWORK=$(jq -c '.services[0].networkConfiguration' service.json)
          TASK=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE --task-definition "$TASK_DEFINITION" --network-configuration "$NETWORK" --overrides file://approval-overrides.json --query 'tasks[0].taskArn' --output text)
          test "$TASK" != "None"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT_CODE" = "0"
          echo 'Approved alternate Google email on the verified existing profile.' >> "$GITHUB_STEP_SUMMARY"
