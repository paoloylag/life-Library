[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "library-attendance-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.13", "pydantic-settings>=2.6", "authlib>=1.3", "httpx>=0.27", "itsdangerous>=2.2", "argon2-cffi>=23.1"]
[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "ruff>=0.7"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]


