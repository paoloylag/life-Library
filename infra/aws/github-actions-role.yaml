AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC deployment role for a Life Library environment

Parameters:
  GitHubOrganization:
    Type: String
    Default: paoloylag
  GitHubOrganizationId:
    Type: String
    Default: '265470974'
  GitHubRepository:
    Type: String
    Default: life-Library
  GitHubRepositoryId:
    Type: String
    Default: '1349099711'
  GitHubEnvironment:
    Type: String
    Default: aws-staging
  DeploymentEnvironment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the account's token.actions.githubusercontent.com OIDC provider

Resources:
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'life-library-github-${DeploymentEnvironment}-deploy'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrganization}@${GitHubOrganizationId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: !Sub 'DeployLifeLibrary${DeploymentEnvironment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuthentication
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: BackendImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/life-library-backend'
              - Sid: EcsRelease
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:RunTask
                  - ecs:UpdateService
                Resource: '*'
              - Sid: PassApplicationRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/life-library-${DeploymentEnvironment}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/life-library-${DeploymentEnvironment}/*'
              - Sid: PublishFrontend
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::life-library-${DeploymentEnvironment}-frontendbucket-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::life-library-${DeploymentEnvironment}-frontendbucket-*/*'
              - Sid: RefreshCloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'

Outputs:
  DeploymentRoleArn:
    Value: !GetAtt DeploymentRole.Arn
