<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life College email previews</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f6;color:#17191f;font:14px Arial,sans-serif}header{padding:18px 24px;border-bottom:1px solid #d9dde2;background:#fff}h1{font:700 24px Georgia,serif;color:#690f0d;margin:0 0 8px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}select{min-height:44px;padding:8px 12px;border:1px solid #ccc;border-radius:6px;font:inherit}p{margin:10px 0;color:#626a76}.email-preview{display:block;width:100%;max-width:760px;height:1250px;border:0;margin:12px auto}label{font-size:12px;font-weight:700}.subject{max-width:760px;margin:20px auto 0;padding:0 20px;font-size:13px}small{color:#626a76;font-weight:400}</style></head><body><header><h1>Booking email previews</h1><p>Sample content only. No emails are being sent.</p><div class="controls"><label>Template <select id="template" aria-label="Email template"><option value="booking-confirmed.html">Booking confirmed</option><option value="booking-cancelled.html">Booking cancelled</option><option value="session-extended.html">Session extended</option><option value="booking-reminder.html">Your booking starts soon</option></select></label><label>Width <select id="width" aria-label="Preview width"><option value="760">Desktop</option><option value="390">Phone</option></select></label></div></header><div class="subject"><strong>Subject:</strong> <span id="subject"></span></div><iframe class="email-preview" id="preview" title="Email preview" src="booking-confirmed.html"></iframe><script>const subjects={"booking-confirmed.html":"Booking Confirmed - Collaboration Room 1 | LIB-20261020-001","booking-cancelled.html":"Booking Cancelled - Collaboration Room 1 | LIB-20261020-001","session-extended.html":"Session Extended - Collaboration Room 1 | LIB-20261020-001","booking-reminder.html":"Your Collaboration Room 1 booking starts in 15 minutes"};const picker=document.getElementById('template'),frame=document.getElementById('preview');function update(){frame.src=picker.value;document.getElementById('subject').textContent=subjects[picker.value]}picker.addEventListener('change',update);document.getElementById('width').addEventListener('change',event=>frame.style.maxWidth=event.target.value+'px');update();</script></body></html>
